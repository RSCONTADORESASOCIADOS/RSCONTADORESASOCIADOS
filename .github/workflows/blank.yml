📱 App Roque & Sandoval - Gestión Contable Inteligente

Bienvenido al repositorio oficial de la aplicación móvil de Roque & Sandoval Contadores Asociados. Esta herramienta ha sido diseñada para transformar la relación entre el contador y el empresario, brindando soluciones rápidas, eficientes y seguras en la palma de su mano.
🚀 Funcionalidades Principales

La aplicación integra herramientas críticas para la salud financiera y tributaria de cualquier negocio:

    Calculadora de Detracciones (SPOT): Desglose automático de facturas en Soles y Dólares, facilitando el depósito exacto al Banco de la Nación.

    Cruce con SIRE (SUNAT): Módulo de auditoría preventiva para detectar facturas omitidas y asegurar el uso correcto del crédito fiscal.

    Validador de RUC: Verificación en tiempo real del estado (Activo/Habido) de proveedores y clientes.

    Tablero de Vencimientos: Calendario personalizado basado en el último dígito del RUC para evitar multas por declaraciones tardías.

    Generador de Reportes PDF: Exportación de liquidaciones de impuestos con un diseño profesional y corporativo.

🎨 Identidad Corporativa

El diseño de la interfaz respeta estrictamente la identidad visual de la firma:

    Colores: Azul Marino Profundo (#1B264F) para profesionalismo y Naranja/Rojo Coral (#E63946) para acciones clave.

    Banners de Servicio: Secciones visuales dedicadas a Asesoría Tributaria y Asesoría Laboral.

⚖️ Sustento Legal y Normativo

Esta aplicación opera bajo el marco legal peruano vigente:

    Tributario: Alineado al Código Tributario (D.L. 816) y la normativa del SIRE (R.S. 112-2021/SUNAT).

    Laboral: Basado en la Ley de Productividad y Competitividad Laboral (D.L. 728) para la prevención de contingencias ante SUNAFIL.

    Financiero: Cumplimiento del Sistema de Pago de Obligaciones Tributarias (D.L. 940).

